version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfillx-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fulfillx
      - POSTGRES_PASSWORD=fulfillx_secret_pass
      - POSTGRES_DB=fulfillx_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillx -d fulfillx_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fulfillx-net

  redis:
    image: redis:7-alpine
    container_name: fulfillx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fulfillx-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fulfillx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - AI_PROVIDER=mock
      - WEBSOCKET_ENABLED=true
      - EVALUATION_ENABLED=true
      - PERSISTENCE_MODE=memory
      - DATABASE_URL=postgresql+asyncpg://fulfillx:fulfillx_secret_pass@postgres:5432/fulfillx_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - fulfillx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fulfillx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - fulfillx-net

volumes:
  postgres_data:

networks:
  fulfillx-net:
    driver: bridge
