name: FULFILL-X CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Regression & Smoke Tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript & Vite Production Build
        working-directory: ./frontend
        run: npm run build

  terraform-validate:
    name: Terraform IaC Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Initialize & Validate Terraform Code
        working-directory: ./infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
